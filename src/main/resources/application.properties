spring.application.name=invoice

# ========================
# SERVER
# ========================

#server.port=8086


frontend.url=${FRONTEND_URL}
# ========================
# DATABASE (PostgreSQL)
# ========================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

## application.properties
#
#spring.security.oauth2.client.registration.google.client-id=${CL_ID}
#spring.security.oauth2.client.registration.google.client-secret=${CL_SC}
#spring.security.oauth2.client.registration.google.scope=email,profile


# ===== Hikari + Neon SAFE CONFIG =====
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.keepalive-time=30000

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000


# Server


# ========================
# FILE STORAGE (PDF Location)
# ========================
invoice.pdf.storage.path=./generated-pdfs/

# ========================
# SPRING MAIL CONFIG (Gmail SMTP)
# ========================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_GMAIL}
spring.mail.password=${MAIL_APPPASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG