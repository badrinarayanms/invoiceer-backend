version: "3.8"
services:
  app:
    build:
      context: ..
      dockerfile: .devup/Dockerfile
    ports:
      - "8086:8086"
    volumes:
      - ..:/app
      - /app/node_modules
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 5
